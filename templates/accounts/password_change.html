{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 d-flex align-items-center gap-2"><span class="ua-icon text-primary" data-ua="key" data-ua-interaction="hover-replay" data-ua-size="24"></span>Change Password</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}{% include "partials/field.html" with field=field %}{% endfor %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-1"><span class="ua-icon" data-ua="check-circle" data-ua-interaction="click-replay" data-ua-size="18"></span>Update Password</button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
